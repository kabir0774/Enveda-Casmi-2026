[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi26"
version = "0.1.0"
description = "Enveda CASMI 2026 - molecule identification from MS/MS spectra"
requires-python = ">=3.10"
dependencies = [
  "rdkit", "numpy", "scipy", "polars", "pyarrow", "lightgbm", "tqdm",
]

[tool.setuptools.packages.find]
include = ["casmi26*"]
